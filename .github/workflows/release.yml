name: Release

# Publishes @reatomized/convex and @reatomized/convex-storybook when their
# package.json on `reatom` holds a version npm doesn't have yet, then tags the
# commit `v<version>` and `convex-storybook-v<version>`.
on:
  push:
    branches: [reatom]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release tag
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Find unpublished versions
        id: version
        run: |
          publish=false
          for dir in . packages/convex-storybook; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            key=$([ "$dir" = . ] && echo core || echo storybook)
            echo "${key}_version=$version" >> "$GITHUB_OUTPUT"
            if npm view "$name@$version" version 2>/dev/null | grep -q .; then
              echo "$name@$version is on npm already."
              echo "$key=false" >> "$GITHUB_OUTPUT"
            else
              echo "$key=true" >> "$GITHUB_OUTPUT"
              publish=true
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Trusted publishing (configured on npmjs.com for this repo and
      # release.yml) needs npm 11.5.1 or later. No NPM_TOKEN secret.
      - name: Update npm
        if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest

      # @reatom/core comes from a pkg.pr.new URL, which npm 12 installs only
      # when allowed.
      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: npm ci --allow-remote=root

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          npm run typecheck
          npm test -- --silent=true

      # prepack builds each package. The addon's build reads the core's
      # declarations, so the core packs first.
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: |
          npm pack
          npm pack --workspace packages/convex-storybook

      - name: Publish @reatomized/convex
        if: steps.version.outputs.core == 'true'
        env:
          VERSION: ${{ steps.version.outputs.core_version }}
        run: |
          npm publish "reatomized-convex-$VERSION.tgz" --access public
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish @reatomized/convex-storybook
        if: steps.version.outputs.storybook == 'true'
        env:
          VERSION: ${{ steps.version.outputs.storybook_version }}
        run: |
          npm publish "reatomized-convex-storybook-$VERSION.tgz" --access public
          git tag "convex-storybook-v$VERSION"
          git push origin "convex-storybook-v$VERSION"
