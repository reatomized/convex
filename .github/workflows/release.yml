name: Release

on:
  push:
    branches: [reatom]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the Version Packages PR and git tags
      pull-requests: write # open/update the release PR
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (configured on npmjs.com for this repo and
      # release.yml) needs npm 11.5.1 or later. No NPM_TOKEN secret.
      - name: Update npm (OIDC trusted publishing)
        run: npm install -g npm@latest

      # @reatom/core comes from a pkg.pr.new URL, which npm 12 installs only
      # when allowed.
      - name: Install
        run: npm ci --allow-remote=root

      - name: Build
        run: npm run build

      - name: Create release PR or publish to npm
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
