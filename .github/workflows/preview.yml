name: Preview release

# Publishes an installable preview of every commit / PR via pkg.pr.new, e.g.
#   npm install https://pkg.pr.new/reatomized/convex@<sha>
on:
  push:
    branches: [reatom]
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Install
        run: npm ci --allow-remote=root

      - name: Build
        run: npm run build

      - name: Publish preview
        run: |
          npx pkg-pr-new publish .
          npx pkg-pr-new publish packages/convex-storybook
